; LanPad game list (shipped with LanPad - an update replaces this file).
; Your own changes (exe paths, new games, other keys) go in games.user.ini, same format, never replaced.
;
; [Game name]
; Players = most players at the same time (host keyboard + joined PCs; LanPad allows max 4 joined PCs)
; Layout  = controls sent to joined PCs:
;           Sports   WASD move, arrows right stick, K L J I = A B X Y, Q E = LB RB, Space LT, Shift RT
;           Fighting WASD move, U I O P = X Y RB LB, J K L ; = A B RT LT   (Tekken: U I J K = 1 2 3 4)
;           Action   WASD move, Space = A (jump), J = X, K = B, I = Y, Q E = LB RB, U O = LT RT
;           Racing   W gas, S brake, A D steer, Space = A, J K I = X B Y, Q E = LB RB
; Find    = exe file names used to find the game on this PC (comma-separated)
; Exe     = full path to the game exe (the Browse button saves it in games.user.ini)
; Notes   = tip shown on the host screen
; A=, B=, LT=, ... = change single keys for this game (same names as [Keys] in lanpad.ini)

