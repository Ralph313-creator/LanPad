; LanPad settings. Lines starting with ; are comments.
; Key names: letters (A-Z), digits (1-9, 0), F1-F12, Up/Down/Left/Right, Space, Enter, Backspace,
; Tab, Esc, Shift/LShift/RShift, Ctrl/LCtrl/RCtrl, Alt/LAlt/RAlt, NumPad0-NumPad9, or any
; System.Windows.Forms.Keys name. Several keys for one button: separate with commas (e.g. K,NumPad2).

[General]
; UDP port for controller input and discovery (open on the host firewall)
Port=47800
; UDP port for the video stream (multicast group 239.255.77.<host last IP number>)
StreamPort=5004
; Look for a newer LanPad on GitHub when LanPad opens (needs internet; nothing happens when offline)
CheckUpdates=true

[Host]
; Name shown to players in the host list (empty = this PC's name)
HostName=
; Game picked on the host screen (any name from games.ini). The host's choice sets the
; controls (Sports / Fighting / Action / Racing) for every joined PC automatically.
Game=NBA 2K14
; Where to look for installed games (separate folders with ;)
GameFolders=G:\Offline Games;D:\Games;E:\Games;C:\Games;C:\Program Files (x86)\Steam\steamapps\common;C:\Program Files\Epic Games
; true = the host PC's keyboard is also a player (a 2-player game then lets 1 PC join)
HostPlays=true
; 4-digit room PIN: "random" = new PIN every time you host, "off" = no PIN, or a fixed number like 1234
RoomPin=random
; Remote players allowed (1-4). Windows supports max 4 Xbox controllers in total: Xbox controllers
; plugged into the host PC when hosting starts keep their slot, so fewer PCs can join then.
MaxPlayers=4
; Plug all virtual controllers in at start, so the game sees them before players join
PrePlugPads=true
; Stream settings
Fps=60
BitrateKbps=15000
; Encoder: auto (AMD hardware if possible), amf, or x264 (CPU, 720p)
Encoder=auto
; Which monitor to capture (0 = main)
Display=0
; Keep streaming even when nobody is joined
AlwaysStream=false

[Join]
; Your name shown on the host (empty = this PC's name)
PlayerName=
; LanPad hotkeys (also on the Settings page): one key, optionally with Ctrl / Shift / Alt, e.g. F12, Ctrl+F12, Alt+P
; Pad mode on/off
ToggleKey=F12
; Leave the game
LeaveKey=Ctrl+F12
; Switch to your own PC (stream hidden, keyboard / mouse normal, still joined) and back to the game
SwitchKey=Alt+F12
; While Pad mode is on, block mouse clicks too (stops accidental clicks on the stream)
SwallowMouse=true
; Viewer: mpv (best) or ffplay
Viewer=mpv
; Turn Pad mode on automatically after joining (keyboard becomes the controller)
AutoPadMode=true
; Show the host's screen full screen (false = window on half the screen, for testing)
Fullscreen=true

[Performance]
; Smooth-play tweaks while hosting or joined (also on the Settings page). All are undone afterwards.
; LanPad at High priority, ffmpeg / mpv above normal, input threads in the Windows "Games" class
HighPriority=true
; Stop Windows 11 from slowing down LanPad, ffmpeg and mpv when they are in the background,
; and use a 1 ms Windows timer so input is sent on time
NoThrottling=true
; No sleep, screen saver or screen off during a game
KeepAwake=true
; Send each controller change this many extra times, 10 ms apart, in case a packet is lost (0-4)
InputResend=2

[Keys]
; Sports layout (used by games with Layout=Sports in games.ini, e.g. NBA 2K14).
; Fighting / Action / Racing layouts are built in; change single keys per game in games.user.ini.
; Left stick (move)
LeftUp=W
LeftDown=S
LeftLeft=A
LeftRight=D
; Right stick (pro stick)
RightUp=Up
RightDown=Down
RightLeft=Left
RightRight=Right
; Face buttons
A=K
B=L
X=J
Y=I
; Shoulders and triggers
LB=Q
RB=E
LT=Space
RT=LShift
; Menu buttons
Start=Enter
Back=Backspace
; Stick clicks
L3=R
R3=F
; D-pad
DUp=1
DDown=2
DLeft=3
DRight=4
; Optional: hold to move the left stick at half speed (empty = none)
Walk=
